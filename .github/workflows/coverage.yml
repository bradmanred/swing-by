# Checks Swing By's coverage county by county, biggest population first, against playgrounds mapped on
# OpenStreetMap, and says which councils' own play area lists to check first. The report appears on the run's
# summary page and as a downloadable "coverage-report".
# Runs every Wednesday and adds up to 150 playgrounds (change the number with a repository variable called
# COVERAGE_WEEKLY_ADD, under Settings > Secrets and variables > Actions > Variables; 0 makes it report only).
# It works in the same order as before: council lists it can read first (added as verified), then OpenStreetMap
# ones as Unverified, but only in councils whose own lists have been checked (src/data/council-sources.json).
# It never fills a council that hasn't been checked, so when it runs out of those, the pull request lists the
# next councils to research by hand (docs/finding-playgrounds.md). It refreshes the nearest toilets and opens one
# pull request for you to review, and skips the week if an earlier coverage pull request is still open, so
# unreviewed work never piles up or overlaps.
# From the Actions tab you can also run it on demand, for one county, or with the OpenStreetMap fallback.
name: Check coverage
on:
  workflow_dispatch:
    inputs:
      add:
        description: 'Add up to this many missing playgrounds (0 = report only)'
        default: '0'
      only:
        description: 'Check one county only, e.g. Kent (leave blank for all)'
        default: ''
      osm_fallback:
        description: "Also fill gaps from OpenStreetMap in councils whose own lists haven't been checked yet"
        type: boolean
        default: false
  schedule:
    - cron: '41 3 * * 3'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: coverage
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Decide how many to add
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_ADD: ${{ inputs.add || '0' }}
          WEEKLY_ADD: ${{ vars.COVERAGE_WEEKLY_ADD || '150' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then add="$WEEKLY_ADD"; else add="$MANUAL_ADD"; fi
          case "$add" in ''|*[!0-9]*) echo "::error title=Check coverage::'$add' isn't a number of playgrounds."; exit 1;; esac
          # An earlier coverage pull request that hasn't been merged or closed would overlap with a new one, because
          # both are built from main. On the weekly run, wait for it to be dealt with.
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '[.[] | select(.head.ref | startswith("coverage/"))] | length')
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$open" != "0" ] && [ "$add" != "0" ]; then
            echo "::notice title=Check coverage::A coverage pull request is still open, so this week is report only."
            add=0
          fi
          echo "add=$add" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check coverage
        env:
          ADD: ${{ steps.plan.outputs.add }}
          ONLY: ${{ inputs.only || '' }}
          FALLBACK: ${{ inputs.osm_fallback && '--osm-fallback' || '' }}
        run: |
          if [ -n "$ONLY" ]; then node scripts/find-gaps.mjs --add "$ADD" --only "$ONLY" $FALLBACK; else node scripts/find-gaps.mjs --add "$ADD" $FALLBACK; fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/
      - name: Open a pull request with the added playgrounds
        if: ${{ steps.plan.outputs.add != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- src/content/playgrounds)" ]; then echo "Nothing to add"; exit 0; fi
          node scripts/nearest-toilets.mjs
          branch="coverage/$(date +%Y-%m-%d)-${{ github.run_number }}"
          git config user.name "swing-by-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/content/playgrounds src/data/toilets.json
          git commit -m "Add playgrounds found by the coverage check"
          git push -u origin "$branch"
          grep -E '^(Added|Nothing added|- )' reports/coverage.md > body.md || true
          # The next councils to research by hand, biggest counties first (the whole list is in the coverage-report).
          { printf '\n## Next councils to check by hand\n\nThese have gaps on OpenStreetMap but their own play area lists haven'"'"'t been checked yet (docs/finding-playgrounds.md). Once one is done, add it to src/data/council-sources.json and the next weekly run can fill its remaining gaps.\n\n'; awk '/^\| County \| Council \| Missing/{f=1} f&&/^\|/{print; n++} n>=14{exit}' reports/coverage.md; } >> body.md
          printf '\n\nFound by the "Check coverage" workflow. Council-listed playgrounds are verified, with the council as source; OpenStreetMap ones are Unverified, with their OpenStreetMap page as source. The build checks start when you push a commit or re-run them from the Checks tab.\n' >> body.md
          gh pr create --base main --head "$branch" --title "Coverage check: add missing playgrounds" --body-file body.md \
            || echo "::warning title=Check coverage::Pushed $branch but couldn't open a pull request (Settings > Actions > General > 'Allow GitHub Actions to create pull requests'). Open it from the branch instead."
