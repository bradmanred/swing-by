# Monthly snapshot of the playgrounds and parks mapped on OpenStreetMap across the UK (scripts/osm-snapshot.mjs).
# Downloads Geofabrik's daily extracts of Great Britain and of Ireland and Northern Ireland, keeps only playgrounds,
# the play equipment mapped in them, parks, gardens, commons, recreation grounds and nature reserves, and the grounds
# of schools, pubs, hotels and holiday parks (whose playgrounds aren't public), and saves a small file to the "osm-data" branch.
# The pin check, the junction job and new-area pin placement read it instead of asking the busy Overpass servers,
# which turns 30-40 minute runs into a minute or two. They only use it when it's under five weeks old, and fall back
# to asking Overpass otherwise. It also keeps each playground's nearest named street and a list of named places, so
# the coverage and junction jobs can name new playgrounds without one Nominatim lookup per playground. Runs on the 2nd of each month and on demand. Nothing on main changes.
name: OpenStreetMap snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 2 * *'
permissions:
  contents: write
concurrency:
  group: osm-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download and filter the extracts
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          # Only the tags the snapshot reads, so the street files stay small.
          echo '{"attributes":{"type":true,"id":true},"include_tags":["name","highway","place"]}' > names.json
          echo '{"attributes":{"type":true,"id":true},"include_tags":["name","place","boundary","admin_level"]}' > areas.json
          for area in europe/great-britain europe/ireland-and-northern-ireland; do
            name=$(basename "$area")
            curl -sSfL --retry 3 -o "$name.osm.pbf" "https://download.geofabrik.de/$area-latest.osm.pbf"
            osmium tags-filter -O -o "$name-play.osm.pbf" "$name.osm.pbf" \
              nwr/leisure=playground,park,garden,common,recreation_ground,nature_reserve nwr/landuse=recreation_ground \
              n/playground \
              a/amenity=school,kindergarten,college,university,pub a/landuse=education \
              a/tourism=hotel,motel,caravan_site,camp_site,holiday_village a/leisure=resort
            osmium export -O -f geojsonseq -a type,id -o "$name.play.geojsonseq" "$name-play.osm.pbf"
            # Named streets and places, for naming new playgrounds without asking Nominatim (scripts/osm-names.mjs).
            osmium tags-filter -O -o "$name-streets.osm.pbf" "$name.osm.pbf" \
              w/highway=trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road,pedestrian,footway
            osmium tags-filter -O -o "$name-named.osm.pbf" "$name-streets.osm.pbf" w/name
            osmium export -O -f geojsonseq -c names.json --geometry-types=linestring,polygon -o "$name.roads.geojsonseq" "$name-named.osm.pbf"
            osmium tags-filter -O -o "$name-places.osm.pbf" "$name.osm.pbf" n/place=city,town,village,hamlet,suburb,quarter,neighbourhood
            osmium export -O -f geojsonseq -c names.json --geometry-types=point -o "$name.places.geojsonseq" "$name-places.osm.pbf"
            # Outlines of places and civil parishes (scripts/osm-names.mjs places playgrounds inside them).
            osmium tags-filter -O -o "$name-areas.osm.pbf" "$name.osm.pbf" a/place=city,town,village,hamlet,suburb,quarter,neighbourhood r/admin_level=10
            osmium export -O -f geojsonseq -c areas.json --geometry-types=polygon -o "$name.areas.geojsonseq" "$name-areas.osm.pbf"
            rm "$name.osm.pbf" "$name-streets.osm.pbf" "$name-named.osm.pbf" "$name-areas.osm.pbf"
          done
          ls -la
      - name: Build the snapshot
        run: node scripts/osm-snapshot.mjs snapshot work/*.play.geojsonseq --roads work/*.roads.geojsonseq --places work/*.places.geojsonseq --areas work/*.areas.geojsonseq
      - name: Save it to the osm-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$PWD/snapshot"
          tmp=$(mktemp -d) && cd "$tmp"
          git init -q
          git config user.name "swing-by-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # One commit only, replaced each month, so the branch never grows.
          git checkout -q --orphan osm-data
          cp "$src"/* .
          printf '# OpenStreetMap snapshot\n\nMade by the "OpenStreetMap snapshot" workflow from Geofabrik extracts. Data (c) OpenStreetMap contributors, ODbL.\n' > README.md
          git add -A
          git commit -q -m "OpenStreetMap snapshot $(jq -r .date meta.json)"
          git push -q -f origin osm-data
          cat meta.json >> "$GITHUB_STEP_SUMMARY"
