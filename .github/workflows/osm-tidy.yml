# Tidies playgrounds already listed from OpenStreetMap alone (scripts/osm-tidy.mjs): renames made-up names
# ("Playground off Elm Road") after the park they're in, fills in equipment, ages and step-free access mapped on
# OpenStreetMap, and lists ones inside school, pub, hotel or holiday park grounds for a person to check. Opens one pull
# request for you to review. Runs on the 4th of each month, after the monthly OpenStreetMap snapshot (the 2nd), and on
# demand (a region at a time if the pull request would be too big to review).
name: Tidy OpenStreetMap listings
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Only this region, e.g. devon or north-west (leave blank for all)'
        default: ''
      renames:
        description: 'Rename at most this many'
        default: '3000'
      dry_run:
        description: 'Report only (no pull request)'
        type: boolean
        default: false
  schedule:
    - cron: '29 5 4 * *'
permissions:
  contents: write
  pull-requests: write
  actions: write # to start the build checks on the branch
concurrency:
  group: coverage # changes the same files as the coverage job
  cancel-in-progress: false
jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/osm-snapshot
      - name: Tidy
        env:
          REGION: ${{ inputs.region }}
          RENAMES: ${{ inputs.renames || '3000' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "${OSM_PLAYGROUNDS:-}" ]; then echo "::error title=Tidy::No recent OpenStreetMap snapshot: run the OpenStreetMap snapshot workflow first."; exit 1; fi
          node scripts/osm-tidy.mjs --renames "$RENAMES" ${REGION:+--region "$REGION"} $DRY
          cat reports/osm-tidy.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: osm-tidy-report
          path: reports/
      - name: Open a pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- src/content/playgrounds)" ]; then echo "Nothing to change"; exit 0; fi
          node scripts/nearest-toilets.mjs
          node scripts/coverage-areas.mjs
          branch="osm-tidy/$(date +%Y-%m-%d)-${{ github.run_number }}"
          git config user.name "swing-by-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A src/content/playgrounds src/data/toilets.json src/data/coverage.json worker/index.js
          git commit -m "Tidy OpenStreetMap-only playgrounds: park names and mapped details [skip toilets]"
          git push -u origin "$branch"
          gh workflow run ci.yml --ref "$branch" || echo "::warning title=Tidy::Couldn't start the build checks; re-run them from the pull request."
          { sed -n '3,8p' reports/osm-tidy.md; printf '\nThe full lists are in the run'"'"'s osm-tidy-report artifact. Everything changed is still Unverified; nothing was deleted.\n'; } > body.md
          gh pr create --base main --head "$branch" --title "Tidy OpenStreetMap-only playgrounds" --body-file body.md \
            || echo "::warning title=Tidy::Pushed $branch but couldn't open a pull request. Open it from the branch instead."
