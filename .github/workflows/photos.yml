# Finds openly licensed photos (Geograph, Wikimedia Commons) for playgrounds without one, and sends them to
# the moderation queue at /moderate/. Nothing shows on the site until a moderator approves it.
# Runs every Monday (picking up the week's new playgrounds in one go, to save Actions minutes) and on demand from the
# Actions tab.
# Needs two repository secrets: MOD_TOKEN (the same moderator key as the Worker) and GEOGRAPH_KEY.
# Run it from the Actions tab on another branch for a dry run, which only lists what it would suggest.
name: Find playground photos
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Find photos
        env:
          SITE: https://swing-by.co.uk
          MOD_TOKEN: ${{ secrets.MOD_TOKEN }}
          GEOGRAPH_KEY: ${{ secrets.GEOGRAPH_KEY }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            node scripts/find-photos.mjs --limit 150
          else
            node scripts/find-photos.mjs --dry-run --limit 25
          fi
