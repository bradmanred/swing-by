# Quarterly check for changes to playgrounds already listed (scripts/quarterly-check.mjs). Runs without Claude: it
# reads the council lists that have a feed in src/data/council-sources.json, checks playgrounds sourced from
# OpenStreetMap are still mapped, checks every official source link still works, and lists playgrounds not checked
# for over a year. The check itself changes no files; its full lists are in the run's "quarterly-check" artifact.
# The "fix" job then hands the report to Claude in the same run (fix-check-report.yml), which fixes what it can and
# opens a pull request for review. If Claude isn't set up or can't finish, it opens a check-report issue instead, for
# the daily "Fix check reports" Claude task (see docs/fixing-check-reports.md). Runs on the 10th of January, April, July and October, and on demand.
name: Quarterly playground check
on:
  workflow_dispatch:
    inputs:
      skip:
        description: 'Leave out parts: councils, osm, links or stale (comma-separated, blank for everything)'
        default: ''
  schedule:
    - cron: '23 5 10 1,4,7,10 *'
permissions:
  contents: read
concurrency:
  group: quarterly-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check listed playgrounds
        env:
          SKIP: ${{ inputs.skip || '' }}
        run: node scripts/quarterly-check.mjs --skip "$SKIP"
      - uses: actions/upload-artifact@v4
        with:
          name: quarterly-check
          path: reports/
      - name: Show the report
        run: cat reports/quarterly-check.md >> "$GITHUB_STEP_SUMMARY"
  fix:
    needs: check
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/fix-check-report.yml
    with:
      artifact: quarterly-check
      title: Quarterly playground check
    secrets: inherit
