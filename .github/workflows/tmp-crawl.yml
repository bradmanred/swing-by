# Temporary (removed before merge): reads Redbridge's park pages (tmp/crawl2.mjs) into tmp/records2.json.
name: tmp crawl
on:
  push:
    branches: ['claude/london-2']
    paths: ['tmp/crawl2.mjs', '.github/workflows/tmp-crawl.yml']
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tmp/crawl2.mjs
      - run: |
          git config user.name "swing-by-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/records2.json && git commit -m "tmp: Redbridge records" && git pull --rebase origin claude/london-2 && git push
