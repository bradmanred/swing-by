name: Temporary Essex fetch
on:
  push:
    branches: [tmp-essex]
    paths: ['tmp/councils.json', '.github/workflows/tmp-essex.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -rf tmp/crawl6 && python3 tmp/crawl3.py || true
      - run: |
          git config user.name swing-by-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp/crawl6; git commit -m "Junction crawl" && git pull --rebase && git push
