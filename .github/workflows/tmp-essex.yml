name: Temporary Essex fetch
on:
  push:
    branches: [tmp-essex]
    paths: ['tmp/find-gaps.mjs', '.github/workflows/tmp-essex.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          git fetch -q origin main && git checkout origin/main -- src/content/playgrounds src/data/council-sources.json
          rm -rf tmp/kb && mkdir -p tmp/kb
          for c in Kent Bedfordshire; do
            ls src/content/playgrounds > /tmp/before.txt
            node tmp/find-gaps.mjs --only "$c" --add 3000 --osm-fallback
            ls src/content/playgrounds | comm -13 /tmp/before.txt - | xargs -I{} cp src/content/playgrounds/{} tmp/kb/
            cp reports/coverage.md tmp/kb-$c.md; cp reports/gaps.json tmp/kb-$c-gaps.json
            git checkout origin/main -- src/content/playgrounds; git clean -fdq src/content/playgrounds
          done
      - run: |
          git config user.name swing-by-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp/kb tmp/kb-*.md tmp/kb-*-gaps.json; git commit -m "Kent and Beds gaps" && git pull --rebase && git push
