name: Temporary Essex fetch
on:
  push:
    branches: [tmp-essex]
    paths: ['tmp/fetch.sh', 'tmp/urls.txt', '.github/workflows/tmp-essex.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -rf tmp/out && bash tmp/fetch.sh
      - run: |
          git config user.name swing-by-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp/out; git commit -m "Fetch" && git pull --rebase && git push
