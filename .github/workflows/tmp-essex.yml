name: Temporary Essex fetch
on:
  push:
    branches: [tmp-essex]
    paths: ['tmp/crawl3.py', 'tmp/councils.json', '.github/workflows/tmp-essex.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tmp/crawl3.py
      - run: |
          git config user.name swing-by-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/crawl5; git commit -m "Council crawl M25" && git pull --rebase && git push
