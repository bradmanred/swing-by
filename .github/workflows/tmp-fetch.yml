name: Temporary fetch
on:
  push:
    branches: [tmp-fetch]
    paths: ['tmp/cands.py', 'tmp/todo-junctions.json', '.github/workflows/tmp-fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils || pip install pdfminer.six
      - run: python3 tmp/cands.py
      - run: |
          git config user.name swing-by-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/cands.json; git commit -m "Fetched pages" && git push
