name: Temporary junctions
on:
  push:
    branches: [tmp-junctions]
    paths: ['tmp/near.py', 'tmp/todo-junctions.json', '.github/workflows/tmp-junctions.yml']
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp/near.py
      - run: |
          git config user.name swing-by-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/essex-osm.csv; git commit -m "Candidates near junctions" && git push
