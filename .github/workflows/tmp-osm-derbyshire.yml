name: Temporary OSM Derbyshire playgrounds
on:
  push:
    branches: [tmp-osm-derbyshire]
    paths: ['.github/workflows/tmp-osm-derbyshire.yml', 'tmp/osm.py', 'tmp/crawl.py']
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp/crawl.py
      - run: |
          git config user.name swing-by-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/pages; git commit -m "Council pages" && git push
