# Temporary (removed before merge): places the new London playground pins on this branch.
name: tmp place pins
on:
  push:
    branches: ['claude/london-3']
    paths: ['tmp/new-pins.json', 'tmp/place-pins.mjs', '.github/workflows/tmp-place-pins.yml']
permissions:
  contents: write
jobs:
  place:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Get the OpenStreetMap snapshot
        run: |
          git fetch --depth 1 origin osm-data
          mkdir -p tmp/osm
          for f in osm-playgrounds.json.gz osm-parks.json.gz; do git show FETCH_HEAD:$f > tmp/osm/$f; done
      - run: node tmp/place-pins.mjs
      - run: cat tmp/pins-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the pins
        run: |
          git config user.name "swing-by-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/playgrounds tmp/pins-report.md
          git commit -m "Place the new London playground pins [skip toilets]"
          git pull --rebase origin claude/london-3
          git push
