# Keeps src/data/toilets.json (nearest public toilets to each playground, from the Toilet Map) up to date,
# and src/data/coverage.json (the counties the home page says we cover).
# Runs when playgrounds are added or moved, once a month for new or changed toilets, and on demand.
# On main it commits the refreshed file straight to main (which redeploys the site). On other branches,
# such as a pull request adding a new area, it commits to that branch so the PR includes the toilets.
name: Update nearest toilets
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 3 * *'
  push:
    paths:
      - 'src/content/playgrounds/**'
      - 'scripts/nearest-toilets.mjs'
      - 'scripts/coverage-areas.mjs'
permissions:
  contents: write
  actions: write # to start the build checks after committing to a pull request branch
concurrency:
  group: toilets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update:
    # Jobs that already refresh the toilets in the same commit (coverage, junctions, pin moves) tag it [skip toilets],
    # and so can a person pushing playgrounds whose pins aren't placed yet, to save a run that would be redone.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip toilets]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # If someone pushes to the branch while this runs, the push is rejected as out of date.
      # Rather than merging (toilets.json would often conflict), start again from the latest
      # branch, regenerate both files and try once more, up to three attempts in all.
      - name: Update and commit if changed
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "swing-by-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node scripts/nearest-toilets.mjs
            node scripts/coverage-areas.mjs
            if git diff --quiet -- src/data/toilets.json src/data/coverage.json; then echo "No change"; exit 0; fi
            git add src/data/toilets.json src/data/coverage.json
            git commit -m "Update nearest toilets from the Toilet Map"
            if git push origin "HEAD:$BRANCH"; then
              # A workflow's own commit doesn't start the pull request checks, so start them on this commit. They
              # replace the run for the commit before, which no longer is the branch's latest.
              if [ "$BRANCH" != main ]; then gh workflow run ci.yml --ref "$BRANCH" || echo "::warning::Couldn't start the build checks on $BRANCH."; fi
              exit 0
            fi
            echo "Push rejected (attempt $attempt); refreshing from origin/$BRANCH and retrying"
            git fetch --depth 1 origin "$BRANCH"
            git reset --hard FETCH_HEAD
            sleep $((attempt * 10))
          done
          echo "::error::Could not push after 3 attempts"
          exit 1
